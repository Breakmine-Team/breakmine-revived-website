    <script>
        (function injectGlobalMCLogger() {
            const globalObj = typeof window !== 'undefined' ? window : global;
            if (globalObj.console.__isMinecraftified) return;

            globalObj.mcLogHistory = [];
            const MAX_LOGS = 20;

            const original = {
                log: globalObj.console.log,
                info: globalObj.console.info,
                warn: globalObj.console.warn,
                error: globalObj.console.error
            };

            globalObj.originalConsole = original;

            const colors = {
                INFO: 'color: white; font-weight: normal !important; text-decoration: none;',
                WARN: 'color: #FFAA00; font-weight: normal !important;',
                ERROR: 'color: #FF5555; font-weight: normal !important;'
            };

            const getCallerFile = () => {
                try {
                    const stack = new Error().stack.split('\n');
                    // Filter out all internal logger helper lines
                    const callerLine = stack.find(line => 
                        line.includes('http') && 
                        !line.includes('getCallerFile') && 
                        !line.includes('formatAndHideLink') && 
                        !line.includes('globalObj.console') &&
                        !line.includes('injectGlobalMCLogger')
                    );
                    if (!callerLine) return "Client";

                    // Regex matches the filename (ignoring .js extension if you want, or keeping it), line number, and column number
                    const match = callerLine.match(/\/([^\/\s?]+?)(?:\.js)?:\s*(\d+):\s*(\d+)/) || callerLine.match(/\/([^\/\s?]+?)(?:\.js)?:(\d+)/);
                    if (match) {
                        const filename = match[1];
                        const line = match[2];
                        const col = match[3] || '0';
                        return `${filename}:${line}:${col}`;
                    }
                    return "Client";
                } catch (e) { return "Server"; }
            };

            const formatAndHideLink = (isFake, fileLoc2, level, args) => {
                const time = new Date().toTimeString().split(' ')[0];
                const fileLoc = isFake ? fileLoc2 : getCallerFile();
                const tag = `[${time}] [${fileLoc}/${level.toUpperCase()}]:`;
                
                const messageString = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ');
                globalObj.mcLogHistory.push(`${tag} ${messageString}`);
                if (globalObj.mcLogHistory.length > MAX_LOGS) globalObj.mcLogHistory.shift();
                console.groupCollapsed(`%c${tag} ${messageString}`, colors[level.toUpperCase()] || colors.INFO);
                original[level](...args);
                
                // Clean up the manual stack trace output
                const trace = new Error();
                const cleanStack = trace.stack.split('\n')
                    .filter(line => 
                        !line.includes('formatAndHideLink') && 
                        !line.includes('globalObj.console') &&
                        !line.includes('injectGlobalMCLogger') &&
                        !line.includes('Error') // Removes the initial 'Error' string line
                    )
                    .join('\n');

                original.log("Trace:\n", cleanStack);
                
                if (performance.memory) {
                    original.log("Memory Usage (at time of logging):", `${Math.round(performance.memory.usedJSHeapSize / 1048576)} MB`);
                }
                console.groupEnd();
            };

            globalObj.console.log = (...args) => { 
              formatAndHideLink(false, null, 'info', args); 
              const logEvent = new CustomEvent('logOccured', {
                detail: args.join(' ')
              });
              document.dispatchEvent(logEvent);
            };
            globalObj.console.info = (...args) => { 
              formatAndHideLink(false, null, 'info', args); 
              const logEvent = new CustomEvent('logOccured', {
                detail: args.join(' ')
              });
              document.dispatchEvent(logEvent);
            };
            globalObj.console.warn = (...args) => {
              formatAndHideLink(false, null, 'warn', args);
              const warnEvent = new CustomEvent('warnOccured', {
                detail: args.join(' ')
              });
              document.dispatchEvent(warnEvent);
            };
            globalObj.console.error = (...args) => {
              formatAndHideLink(false, null, 'error', args);
              const errorEvent = new CustomEvent('errorOccured', {
                detail: args.join(' ')
              });
              document.dispatchEvent(errorEvent);
            };
            globalObj.console.fakeLog = (logL, ...args) => formatAndHideLink(true, logL, 'info', args);
            globalObj.console.fakeError = (logL, ...args) => formatAndHideLink(true, logL, 'error', args);
            globalObj.console.fakeWarn = (logL, ...args) => formatAndHideLink(true, logL, 'warn', args);

            globalObj.console.__isMinecraftified = true;
        })();
    </script>
